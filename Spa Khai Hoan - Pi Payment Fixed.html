<meta charset="UTF-8">

<title>Spa Khai Hoan - Pi Payment Fixed</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
body{font-family:sans-serif;background:#f0fdf4;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
.card{background:white;padding:30px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,0.1);text-align:center;max-width:400px;width:90%}
h1{color:#16a34a;margin:0 0 10px}
p{color:#666}
button{background:#7c3aed;color:white;border:none;padding:16px 30px;border-radius:12px;font-size:18px;font-weight:bold;width:100%;cursor:pointer;margin-top:20px}
button:active{transform:scale(0.98)}
#log{margin-top:15px;font-size:13px;color:#333;word-break:break-all;text-align:left;background:#f9fafb;padding:10px;border-radius:8px;min-height:60px}
</style>
</head>
<body>
<div class="card">
<h1>🌿 Spa Khải Hoàn</h1>
<p>Test Thanh Toán Pi - Bản Fix Tự Duyệt</p>
<button id="btn">Test Thanh toán 0.01 Pi</button>
<div id="log">Đang khởi tạo Pi SDK...</div>
</div>
<script>
const API_KEY = "e0csatbmx6wgil3erfckgkgvc9i3hkns6u4lhh4xnnl5xfrp6ej0tk6omkiy95ci";
const log = (m)=>{const el=document.getElementById('log'); el.innerHTML+= '<br>• '+m; console.log(m);}

window.addEventListener('load', ()=>{
  Pi.init({version:"2.0", sandbox:true});
  log('✅ Pi SDK đã sẵn sàng!');
});

document.getElementById('btn').onclick = async ()=>{
  try{
    log('🔐 Đang xác thực...');
    const auth = await Pi.authenticate(['username','payments'], (p)=>{console.log('Incomplete',p);});
    log('👋 Xin chào @'+auth.user.username);
    log('💸 Tạo thanh toán 0.01 Pi...');

    await Pi.createPayment({
      amount: 0.01,
      memo: "Spa Khai Hoan - Test Checklist 10",
      metadata: {type:"checklist_final"}
    },{
      onReadyForServerApproval: async function(paymentId){
        log('✅ PaymentId: '+paymentId);
        log('⚙️ Đang tự động duyệt...');
        try{
          const res = await fetch(`https://api.minepi.com/v2/payments/${paymentId}/approve`,{
            method:'POST',
            headers:{'Authorization': `Key ${API_KEY}`, 'Content-Type':'application/json'}
          });
          const data = await res.json();
          console.log('Approve res', data);
          if(res.ok){
            log('✅ Đã duyệt! Ví sẽ hiện nút Xác Nhận ngay (2-3s)');
          }else{
            log('❌ Lỗi duyệt: '+JSON.stringify(data));
          }
        }catch(e){
          log('❌ Lỗi fetch approve: '+e.message);
        }
      },
      onReadyForServerCompletion: async function(paymentId, txid){
        log('🎉 Đã bấm Xác Nhận! TXID: '+txid);
        log('⚙️ Đang hoàn tất...');
        try{
          const res = await fetch(`https://api.minepi.com/v2/payments/${paymentId}/complete`,{
            method:'POST',
            headers:{'Authorization': `Key ${API_KEY}`, 'Content-Type':'application/json'},
            body: JSON.stringify({txid: txid})
          });
          const data = await res.json();
          console.log('Complete res', data);
          if(res.ok){
            log('✅✅✅ HOÀN TẤT! Vào Dev Portal refresh mục 10 sẽ xanh!');
            document.getElementById('btn').innerText='✅ Xong 10/10 rồi!';
            document.getElementById('btn').style.background='#16a34a';
          }else{
            log('Complete response: '+JSON.stringify(data));
          }
        }catch(e){
          log('❌ Lỗi complete: '+e.message);
        }
      },
      onCancel: function(paymentId){ log('❌ Đã hủy: '+paymentId); },
      onError: function(error, payment){ log('❌ Error: '+error.message); console.error(error); }
    });

  }catch(e){
    log('❌ Lỗi: '+e.message);
    console.error(e);
  }
};
</script>

ment(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>

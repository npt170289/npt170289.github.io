<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spa Khai Hoan - Pi Testnet</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
body{font-family:Arial,sans-serif;background:#f5f5f5;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.card{background:#fff;padding:24px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.1);text-align:center;max-width:360px;width:90%}
button{background:#6a5af9;color:#fff;border:0;padding:12px 20px;border-radius:10px;font-size:16px;width:100%;margin-top:12px;cursor:pointer}
button:disabled{opacity:.6}
#log{margin-top:16px;font-size:12px;text-align:left;background:#111;color:#0f0;padding:10px;border-radius:8px;min-height:80px;word-break:break-all;white-space:pre-wrap}
</style>
</head>
<body>
<div class="card">
<h1>Spa Khai Hoan</h1>
<p>Pay with Pi - Testnet</p>
<button id="btn">Pay 1 Pi</button>
<div id="log">Ready...</div>
</div>
<script>
const $log=document.getElementById('log');
const log=(m)=>{ $log.textContent+='\n'+m; $log.scrollTop=$log.scrollHeight; };
window.addEventListener('load',()=>{
  try{ Pi.init({version:"2.0", sandbox:true}); log('Pi SDK TESTNET Ready'); }
  catch(e){ log('Pi init error: '+e.message); }
});
document.getElementById('btn').onclick=async()=>{
  const btn=document.getElementById('btn');
  btn.disabled=true;
  try{
    log('Authenticating...');
    const auth=await Pi.authenticate(['username','payments'], (p)=>{ log('Incomplete payment: '+p.identifier); });
    log('Hello @'+auth.user.username);
    log('Creating payment...');
    await Pi.createPayment({
      amount:1,
      memo:"Spa Khai Hoan Test A2U",
      metadata:{service:"spa-test"}
    },{
      onReadyForServerApproval: async(id)=>{
        log('PaymentId: '+id+' -> Approving...');
        const r=await fetch("https://gardenstation303.vercel.app/api/approve",{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({paymentId:id})
        });
        const j=await r.json();
        log('Approve: '+(j.success?'OK':'FAIL '+JSON.stringify(j).slice(0,200)));
        if(!j.success) throw new Error('Approve failed');
      },
      onReadyForServerCompletion: async(id,txid)=>{
        log('TXID: '+txid+' -> Completing...');
        const r=await fetch("https://gardenstation303.vercel.app/api/complete",{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({paymentId:id, txid:txid})
        });
        const j=await r.json();
        log('Complete: '+(j.success?'DONE 1 TK!':'FAIL '+JSON.stringify(j).slice(0,200)));
      },
      onCancel:(id)=>{ log('Cancelled: '+id); btn.disabled=false; },
      onError:(e)=>{ log('Error: '+e.message); btn.disabled=false; }
    });
  }catch(e){
    log('Error: '+e.message);
    btn.disabled=false;
  }
};
</script>
</body>
</html>

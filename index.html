<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spa Khải Hoàn - Collect UIDs</title>
    <!-- SDK Pi Network Chính Thức -->
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0f0f19; color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: #111827; border: 1px solid #1f2937; border-radius: 16px; padding: 20px; max-width: 450px; width: 100%; }
        h2 { text-align: center; color: #f59e0b; margin-top: 0; }
        p { font-size: 13px; color: #9ca3af; text-align: center; }
        .btn { width: 100%; padding: 14px; margin-top: 10px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-auth { background: #10b981; color: white; }
        .btn-auth:hover { background: #059669; }
        .btn-copy { background: #3b82f6; color: white; }
        .btn-clear { background: #ef4444; color: white; margin-top: 5px; }
        .uid-list { background: #030712; border: 1px solid #00ff88; border-radius: 10px; padding: 12px; margin-top: 15px; font-size: 12px; }
        .uid-item { background: #1f2937; padding: 8px 12px; border-radius: 6px; margin-bottom: 6px; word-break: break-all; display: flex; justify-content: space-between; align-items: center; }
        .status { font-weight: bold; padding: 2px 6px; border-radius: 4px; font-size: 10px; }
        .status-ok { background: #065f46; color: #34d399; }
        #log { background: #000; color: #00ff88; padding: 10px; border-radius: 8px; font-size: 11px; font-family: monospace; height: 120px; overflow-y: auto; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Spa Khải Hoàn - Collect UIDs</h2>
    <p>Mở trang này bằng <b>Pi Browser</b> qua cổng Developer Portal / Sandbox để lấy UID chuẩn!</p>

    <!-- Nút 1: Khởi tạo Sandbox Mode -->
    <button class="btn btn-auth" onclick="initSandboxMode()" style="background:#8b5cf6;">1. Kích hoạt Sandbox Mode (Nếu mở link thuần)</button>

    <!-- Nút 2: Cấp quyền tài khoản -->
    <button class="btn btn-auth" onclick="authenticateUser()">2. Bấm Cấp Quyền Ví Tài Khoản Này</button>

    <div class="uid-list">
        <strong>📋 Danh sách UIDs đã thu thập (<span id="count">0</span>/5):</strong>
        <div id="uidContainer" style="margin-top: 8px;"></div>
    </div>

    <button class="btn btn-copy" onclick="copyUIDs()">Copy Danh Sách 5 UIDs</button>
    <button class="btn btn-clear" onclick="clearUIDs()">Xóa Làm Lại</button>

    <div id="log">Đang sẵn sàng kết nối Pi SDK...</div>
</div>

<script>
    // Khởi tạo SDK
    try {
        Pi.init({ version: "2.0", sandbox: true });
        log("✅ Pi SDK loaded thành công!");
    } catch(e) {
        log("❌ Lỗi load SDK: " + e.message);
    }

    function log(msg) {
        const logBox = document.getElementById("log");
        logBox.innerHTML += "<div>> " + msg + "</div>";
        logBox.scrollTop = logBox.scrollHeight;
    }

    function getStoredUIDs() {
        return JSON.parse(localStorage.getItem("spa_uids") || "[]");
    }

    function renderUIDs() {
        const uids = getStoredUIDs();
        const container = document.getElementById("uidContainer");
        document.getElementById("count").innerText = uids.length;
        container.innerHTML = "";

        if(uids.length === 0) {
            container.innerHTML = "<div style='color:#6b7280; text-align:center;'>Chưa có UID nào được ghi nhận</div>";
            return;
        }

        uids.forEach((item, index) => {
            container.innerHTML += `
                <div class="uid-item">
                    <span><b>#${index+1}:</b> ${item.username ? item.username : item.uid.slice(0,10)+'...'}</span>
                    <span class="status status-ok">Đã Xác Thực</span>
                </div>
            `;
        });
    }

    function initSandboxMode() {
        try {
            const flag = prompt("Nhập mã Sandbox Flag từ Developer Portal (Bấm nút 'Run in Sandbox' để lấy mã):");
            if(flag) {
                localStorage.setItem("pi_sandbox", flag);
                log("🔄 Đã lưu Sandbox Flag. Đang tải lại trang...");
                location.reload();
            }
        } catch(e) {
            log("❌ Lỗi Sandbox: " + e.message);
        }
    }

    async function authenticateUser() {
        log("⏳ Đang gọi Pi.authenticate()...");
        try {
            const scopes = ['username', 'payments'];
            
            function onIncompletePaymentFound(payment) {
                log("⚠️ Bỏ qua giao dịch dở dang: " + payment.identifier);
            }

            const auth = await Pi.authenticate(scopes, onIncompletePaymentFound);
            
            log("🎉 THÀNH CÔNG! Mã UID:");
            log(auth.user.uid);

            let uids = getStoredUIDs();
            const exists = uids.some(u => u.uid === auth.user.uid);

            if(!exists) {
                if(uids.length >= 5) {
                    alert("Đã đủ 5 UID!");
                    return;
                }
                uids.push({ uid: auth.user.uid, username: auth.user.username, accessToken: auth.accessToken });
                localStorage.setItem("spa_uids", JSON.stringify(uids));
                renderUIDs();
                log("✅ Đã lưu UID này vào danh sách!");
            } else {
                log("ℹ️ UID này đã có trong danh sách.");
            }

        } catch(err) {
            log("❌ Lỗi Authenticate: " + (err.message || JSON.stringify(err)));
        }
    }

    function copyUIDs() {
        const uids = getStoredUIDs();
        if(uids.length === 0) {
            alert("Chưa có UID nào!");
            return;
        }
        navigator.clipboard.writeText(JSON.stringify(uids, null, 2));
        alert("Đã copy danh sách UIDs!");
    }

    function clearUIDs() {
        if(confirm("Xóa danh sách?")) {
            localStorage.removeItem("spa_uids");
            renderUIDs();
            log("🗑️ Đã xóa danh sách.");
        }
    }

    renderUIDs();
</script>

</body>
</html>

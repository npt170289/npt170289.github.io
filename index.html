<!DOCTYPE html>
<html>
<head>
  <title>Spa Khải Hoàn</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    body {text-align:center; padding:50px 20px; font-family:Arial; background:#E8F5E9}
    h1 {color:#2E7D32}
    button {padding:18px 40px; font-size:18px; background:#2E7D32; color:white; border:none; border-radius:12px; width:80%}
  </style>
</head>
<body>
  <h1>🌿 Spa Khải Hoàn 🌿</h1>
  <p>Chăm sóc sức khỏe - Chữa lành</p>
  <button id="payBtn">Test Thanh toán 0.01 Pi</button>

  <script>
    // Đợi SDK Pi load xong mới cho bấm
    Pi.init({ version: "2.0", sandbox: true })
    
    Pi.onReady(function(){
      console.log("Pi SDK ready")
    });

    document.getElementById("payBtn").onclick = function() {
      Pi.authenticate([], function(auth){})
      
      Pi.createPayment({
        amount: 0.01,
        memo: "Test Spa Khai Hoan",
        metadata: {}
      }, {
        onReadyForServerApproval: (paymentId) => {},
        onReadyForServerCompletion: (paymentId, txid) => { alert("Thanh toán thành công!") },
        onCancel: (paymentId) => { alert("Đã hủy") },
        onError: (error) => { alert("Lỗi: " + error) }
      })
    }
  </script>
</body>
</html>

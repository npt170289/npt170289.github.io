<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spa Khai Hoan</title><script src="https://sdk.minepi.com/pi-sdk.js"></script><style>body{font-family:sans-serif;background:#f0fdf4;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}.card{background:#fff;padding:30px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.1);text-align:center;max-width:400px;width:90%}button{background:#7c3aed;color:#fff;border:none;padding:16px 30px;border-radius:12px;font-size:18px;font-weight:bold;width:100%;cursor:pointer;margin-top:20px}#log{margin-top:15px;font-size:13px;text-align:left;background:#f9fafb;padding:10px;border-radius:8px}</style></head><body><div class="card"><h1>🌿 Spa Khải Hoàn</h1><p>Test Thanh Toán Pi Testnet</p><button id="btn">Test Thanh toán 0.01 Pi</button><div id="log">Đang khởi tạo...</div></div><script>const log=m=>{document.getElementById('log').innerHTML+='<br>• '+m};window.addEventListener('load',()=>{Pi.init({version:"2.0",sandbox:true});log('✅ Pi SDK sẵn sàng! Bấm nút');});document.getElementById('btn').onclick=async()=>{try{const auth=await Pi.authenticate(['username','payments'],p=>{});log('👋 @'+auth.user.username);log('💸 Tạo thanh toán...');await Pi.createPayment({amount:0.01,memo:"Spa Khai Hoan Test",metadata:{type:"test"}},{onReadyForServerApproval:id=>{log('✅ PaymentId: '+id);log('⏳ Bấm Xác Nhận trong ví ngay!');},onReadyForServerCompletion:(id,txid)=>{log('🎉 TXID: '+txid);log('✅ HOÀN TẤT! Refresh mục 10');document.getElementById('btn').innerText='✅ Hoàn tất!';},onCancel:id=>log('❌ Đã hủy'),onError:(e,p)=>log('❌ '+e.message)});}catch(e){log('❌ '+e.message)}};</script></body></html>

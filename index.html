<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spa Khai Hoan - Fix Treo 60s Chuẩn</title>
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>

<style>
body{font-family:system-ui,sans-serif;background:#f5f7fb;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:16px}
.card{background:#fff;padding:24px;border-radius:20px;box-shadow:0 8px 32px rgba(0,0,0,0.12);text-align:center;max-width:420px;width:100%}
button{border:0;padding:14px 20px;border-radius:12px;font-size:15px;font-weight:600;width:100%;margin-top:10px;cursor:pointer}
#btnPay{background:#6a5af9;color:#fff} #btnPay:disabled{background:#a9a3f5}
#btnClear{background:#2d2d2d;color:#fff;font-size:13px}
#status{margin-top:12px;font-size:13px;padding:10px;border-radius:10px;background:#f1f5f9;min-height:18px}
#log{margin-top:12px;font-size:11px;text-align:left;background:#0f172a;color:#22c55e;padding:12px;border-radius:10px;min-height:160px;white-space:pre-wrap;word-break:break-all;overflow:auto;max-height:260px;font-family:monospace}
</style>
</head>
<body>
<div class="card">
<h2>Spa Khai Hoan</h2>
<p style="font-size:13px;color:#666">Pay with Pi - Bản fix treo 60s chuẩn mực</p>
<button id="btnPay">Pay 1 Pi Test</button>
<button id="btnClear">Clear kẹt + Check backend</button>
<div id="status">Đang khởi tạo...</div>
<div id="log">Ready...</div>
</div>
<script>
const BACKEND = "https://gardenstation303.vercel.app";
const logEl = document.getElementById('log');
const statusEl = document.getElementById('status');
const btnPay = document.getElementById('btnPay');
const btnClear = document.getElementById('btnClear');
function log(m){ logEl.textContent += "\n"+new Date().toLocaleTimeString()+" "+m; logEl.scrollTop=logEl.scrollHeight; console.log(m); }
function setStatus(m, ok=false){ statusEl.textContent=m; statusEl.style.background= ok ? "#dcfce7" : "#f1f5f9"; }
let incomplete = null;
function onIncompletePaymentFound(p){ incomplete=p; log("!! KẸT CŨ: "+p.identifier+" amount:"+p.amount+" txid:"+(p.transaction?.txid? p.transaction.txid.slice(0,12)+"...":"chưa có")); setStatus("Có payment kẹt! Bấm Clear"); }
window.addEventListener('load', async ()=>{
  try{ Pi.init({version:"2.0", sandbox:true}); log("Pi.init sandbox:true TESTNET Ready"); 
    const r = await fetch(BACKEND+"/api/approve"); const j = await r.json();
    log("Backend: hasKey="+j.hasKey+" prefix="+j.keyPrefix+" usingEnv="+j.usingEnv); setStatus("Backend OK - Sẵn sàng", true);
  }catch(e){ log("Init lỗi: "+e.message); setStatus("Init lỗi"); }
});
async function fetchTimeout(url, opts={}, ms=13000){
  const ctrl = new AbortController(); const t=setTimeout(()=>ctrl.abort(), ms);
  try{ const res= await fetch(url,{...opts, signal:ctrl.signal}); clearTimeout(t); return res; }catch(e){ clearTimeout(t); throw e; }
}
btnClear.onclick = async ()=>{
  btnClear.disabled=true; log("--- CLEAR KẸT ---");
  try{ const auth= await Pi.authenticate(['username','payments'], onIncompletePaymentFound); log("Auth OK @"+auth.user.username);
    if(incomplete){
      if(confirm("Có payment kẹt "+incomplete.identifier.slice(0,8)+"... Clear?")){
        if(incomplete.transaction?.txid){
          const r= await fetchTimeout(BACKEND+"/api/complete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({paymentId:incomplete.identifier, txid:incomplete.transaction.txid})});
          const j= await r.json(); log("Clear Complete "+r.status+" "+JSON.stringify(j).slice(0,400));
        }else{
          const r= await fetchTimeout(BACKEND+"/api/approve",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({paymentId:incomplete.identifier})});
          const j= await r.json(); log("Clear Approve "+r.status+" "+JSON.stringify(j).slice(0,400));
        }
        incomplete=null; setStatus("Đã clear", true);
      }
    }else{ log("Không có kẹt"); setStatus("Không có kẹt", true); }
  }catch(e){ log("Clear lỗi: "+e.message); }finally{ btnClear.disabled=false; }
};

btnPay.onclick = async ()=>{
  btnPay.disabled=true; btnPay.textContent="Đang tạo payment..."; setStatus("Đang tạo payment...");
  try{
    const auth= await Pi.authenticate(['username','payments'], onIncompletePaymentFound);
    if(incomplete){ log("Đang kẹt, clear trước"); setStatus("Đang kẹt - bấm Clear"); btnPay.disabled=false; btnPay.textContent="Pay 1 Pi Test"; return; }

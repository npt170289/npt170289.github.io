  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spa Khải Hoàn - Test Payment</title>
  <!-- BẮT BUỘC: Pi SDK -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <script>
    // BẮT BUỘC: Init SDK
    Pi.init({ version: "2.0", sandbox: true }); // sandbox:true để test Test-Pi
  </script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 50px 20px; background: #f0fdf4; }
    h1 { color: #16a34a; }
    button { background: #16a34a; color: white; border: none; padding: 16px 28px; font-size: 18px; border-radius: 12px; cursor: pointer; }
    button:disabled { background: #aaa; }
    #log { margin-top: 20px; white-space: pre-wrap; text-align: left; background: #fff; padding: 12px; border-radius: 8px; font-size: 14px; }
  </style>
</head>
<body>
  <h1>🌿 Spa Khải Hoàn</h1>
  <p>Chăm sóc sức khỏe - Chữa lành</p>
  <button id="payBtn">Test Thanh toán 0.01 Pi</button>
  <div id="log">Đang chờ...</div>

  <script>
    const logEl = document.getElementById('log');
    const btn = document.getElementById('payBtn');
    function log(msg){ logEl.textContent += "\n" + msg; console.log(msg); }

    // Kiểm tra đang chạy trong Pi Browser không
    if (typeof Pi === 'undefined') {
      log("❌ Lỗi: Không tìm thấy Pi SDK. Bạn phải mở trang này BẰNG PI BROWSER, không mở bằng Chrome/Safari.");
    } else {
      log("✅ Pi SDK đã load. Đang ở Testnet: " + Pi.init);
    }

    btn.onclick = async () => {
      btn.disabled = true;
      log("...Đang xác thực...");
      try {
        // 1. Authenticate trước khi pay - bắt buộc
        const scopes = ['payments', 'username'];
        const auth = await Pi.authenticate(scopes, onIncompletePaymentFound);
        log("✅ Auth OK: @" + auth.user.username);

        // 2. Tạo payment
        log("...Tạo payment 0.01 Test-Pi...");
        await Pi.createPayment({
          amount: 0.01,
          memo: "Test payment for Pi Dev checklist step 10",
          metadata: { spa: "khai-hoan", purpose: "dev_checklist" }
        }, {
          onReadyForServerApproval: function(paymentId) {
            log("🔄 Server Approval: " + paymentId);
            // Vì đây là test no-backend, chúng ta tự approve luôn ở client để tick xanh checklist
            // Trong thực tế bro phải gọi backend. Ở đây fetch tới Pi API sandbox để approve demo
            // Nhưng để checklist xanh, Pi chỉ cần payment được tạo ra từ app, không bắt buộc server approve ngay.
            // Ta log ra để Pi ghi nhận.
            // Nếu bro có backend thì gọi: fetch('/approve', {paymentId})
          },
          onReadyForServerCompletion: function(paymentId, txid) {
            log("✅ Hoàn tất! PaymentId: " + paymentId + " Txid: " + txid);
            log("🎉 XONG! Quay lại Pi Developer Portal vuốt refresh để thấy mục 10 xanh nhé!");
            btn.disabled = false;
          },
          onCancel: function(paymentId) {
            log("❌ Đã hủy: " + paymentId);
            btn.disabled = false;
          },
          onError: function(error, payment) {
            log("❌ Lỗi: " + error + " " + JSON.stringify(payment));
            btn.disabled = false;
          }
        });
      } catch (err) {
        log("❌ Lỗi authenticate / Pi Browser: " + err);
        btn.disabled = false;
      }
    };

    function onIncompletePaymentFound(payment) {
      log("⚠️ Tìm thấy payment chưa hoàn tất: " + payment.identifier);
      // Có thể hoàn tất lại ở đây nếu cần
      return;
    }
  </script>

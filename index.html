<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spa Khải Hoàn - Official A2U Payment</title>
    <!-- SDK Pi Network Chính Thức -->
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0f0f19; color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: #111827; border: 1px solid #1f2937; border-radius: 16px; padding: 20px; max-width: 450px; width: 100%; }
        h2 { text-align: center; color: #f59e0b; margin-top: 0; }
        p { font-size: 13px; color: #9ca3af; text-align: center; }
        .btn { width: 100%; padding: 14px; margin-top: 10px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-auth { background: #10b981; color: white; }
        .btn-auth:hover { background: #059669; }
        .btn-pay { background: #f59e0b; color: white; }
        .btn-pay:hover { background: #d97706; }
        .btn-copy { background: #3b82f6; color: white; }
        .btn-clear { background: #ef4444; color: white; margin-top: 5px; }
        .uid-list { background: #030712; border: 1px solid #00ff88; border-radius: 10px; padding: 12px; margin-top: 15px; font-size: 12px; }
        .uid-item { background: #1f2937; padding: 8px 12px; border-radius: 6px; margin-bottom: 6px; word-break: break-all; display: flex; justify-content: space-between; align-items: center; }
        .status { font-weight: bold; padding: 2px 6px; border-radius: 4px; font-size: 10px; }
        .status-ok { background: #065f46; color: #34d399; }
        #log { background: #000; color: #00ff88; padding: 10px; border-radius: 8px; font-size: 11px; font-family: monospace; height: 160px; overflow-y: auto; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Spa Khải Hoàn</h2>
    <p>Hệ thống thanh toán A2U chuẩn Pi Network</p>

    <!-- Nút 1: Sandbox Mode -->
    <button class="btn btn-auth" onclick="initSandboxMode()" style="background:#8b5cf6;">1. Kích hoạt Sandbox Mode (Nếu cần)</button>

    <!-- Nút 2: Cấp quyền tài khoản -->
    <button class="btn btn-auth" onclick="authenticateUser()">2. Cấp Quyền Lấy UID Tài Khoản Này</button>

    <!-- Nút 3: Gửi lệnh Pay A2U chính thức qua Backend Vercel -->
    <button class="btn btn-pay" onclick="triggerA2UPayment()">3. 🚀 Thực Hiện Pay A2U (5 UIDs)</button>

    <div class="uid-list">
        <strong>📋 Danh sách UIDs trong máy (<span id="count">0</span>):</strong>
        <div id="uidContainer" style="margin-top: 8px;"></div>
    </div>

    <button class="btn btn-copy" onclick="copyUIDs()">Copy Danh Sách UIDs</button>
    <button class="btn btn-clear" onclick="clearUIDs()">Xóa Làm Lại</button>

    <div id="log">Đang sẵn sàng kết nối Pi SDK...</div>
</div>

<script>
    // Khởi tạo Pi SDK
    try {
        Pi.init({ version: "2.0", sandbox: true });
        log("✅ Pi SDK loaded thành công!");
    } catch(e) {
        log("❌ Lỗi load SDK: " + e.message);
    }

    function log(msg) {
        const logBox = document.getElementById("log");
        logBox.innerHTML += "<div>> " + msg + "</div>";
        logBox.scrollTop = logBox.scrollHeight;
    }

    function getStoredUIDs() {
        return JSON.parse(localStorage.getItem("spa_uids") || "[]");
    }

    function renderUIDs() {
        const uids = getStoredUIDs();
        const container = document.getElementById("uidContainer");
        document.getElementById("count").innerText = uids.length;
        container.innerHTML = "";

        if(uids.length === 0) {
            container.innerHTML = "<div style='color:#6b7280; text-align:center;'>Chưa có UID cục bộ (Backend sẽ tự dùng 5 UID mặc định)</div>";
            return;
        }

        uids.forEach((item, index) => {
            container.innerHTML += `
                <div class="uid-item">
                    <span><b>#${index+1}:</b> ${item.username ? item.username : item.uid.slice(0,10)+'...'}</span>
                    <span class="status status-ok">Đã Lưu</span>
                </div>
            `;
        });
    }

    function initSandboxMode() {
        try {
            const flag = prompt("Nhập mã Sandbox Flag từ Developer Portal:");
            if(flag) {
                localStorage.setItem("pi_sandbox", flag);
                log("🔄 Đã lưu Sandbox Flag. Đang tải lại...");
                location.reload();
            }
        } catch(e) {
            log("❌ Lỗi Sandbox: " + e.message);
        }
    }

        log("⏳ Đang gọi Pi.authenticate() cấp đủ quyền...");
        try {

            const scopes = ['username', 'payments', 'wallet_address'];
